# Holds .agents/assurance.md to .claude/shared/assurance.md: a malformed
# file, a `done` no workflow backs or a gap without an issue fails it, and
# so does a job of this package's own that runs on a documentation-only
# pull request without saying why.
on:
  pull_request:
  push:
    branches: [main]

name: assurance

permissions:
  contents: read

jobs:
  assurance:
    uses: pedrobtz/r-actions/.github/workflows/assurance.yml@v1
    with:
      ungated-jobs: fail
