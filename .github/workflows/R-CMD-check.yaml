on:
  push:
    branches: [main, master]
  # `labeled` so that adding `full-ci` to a pull request reruns it in full.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on each push to a pull request, full after merge. The
      # `full-ci` label runs the full set on a pull request before merging.
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
      # The shared default plus Windows R-devel, the combination CRAN's own
      # Windows check runs and nothing else covers. Full profile only.
      runners: |
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
      # CRAN's NOSUGGESTS and NOLD flavors, full profile only. Every engine
      # and oracle is in Suggests (design D8), and the readers turn text
      # into numbers.
      nosuggests: true
      nold: true
      # The R-devel containers compile rxode2 and mrgsolve from source,
      # about 16 minutes. Pull requests check Ubuntu R-release only and the
      # containers run in the full profile on main (roadmap Stage 1).
      quick-containers: '[]'
      # A runner leg where an engine or oracle failed to install fails
      # instead of skipping their tests (tests/testthat/helper-engines.R).
      env: |
        ZUFAPMX_REQUIRE_ENGINES=true
